<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smoke &amp; Molotov — Design</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; --bg:#0b0d10; --surface:#12151a; --line:#262b33; --text:#e9ecf0; --muted:#8b939e; --accent:#3ddc97; font-family: Inter, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-size:13px; padding:20px 24px 40px; }
h1 { font-size:18px; margin:0 0 4px; letter-spacing:-.01em; }
p.sub { color:var(--muted); margin:0 0 16px; max-width:820px; line-height:1.5; }
.bar { display:flex; gap:24px; align-items:center; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:18px; position:sticky; top:8px; z-index:5; }
.bar label { display:flex; align-items:center; gap:8px; color:var(--muted); }
.bar input[type=range] { width:200px; accent-color:var(--accent); }
.bar b { color:var(--text); font-variant-numeric:tabular-nums; min-width:70px; display:inline-block; }
.grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:14px; }
.col-h { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 6px; }
.col-h em { color:var(--accent); font-style:normal; }
.cell { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; }
canvas { width:100%; aspect-ratio:1; display:block; border-radius:6px; background:#000; }
.row-h { grid-column:1/-1; font-size:15px; font-weight:700; margin:10px 0 0; }
.note { color:var(--muted); font-size:12px; line-height:1.45; margin:8px 2px 2px; }
</style>
</head>
<body>
<h1>Smoke &amp; Molotov</h1>
<p class="sub">Left: the actual renderer pulled out of <code>../cs2</code>. Middle: what cs2demo draws now. Right: proposal. All three draw onto the real Mirage radar at the same world scale. Drag zoom to see how they read at the viewer's default size (1×) versus zoomed in.</p>

<div class="bar">
  <label>Zoom <input type="range" id="zoom" min="0.5" max="6" step="0.1" value="1.6" /> <b id="zoomv"></b></label>
  <label>Time <input type="range" id="time" min="0" max="1" step="0.005" value="0.25" /> <b id="timev"></b></label>
  <label><input type="checkbox" id="anim" /> Play</label>
</div>

<div class="grid" id="grid"></div>

<script>
/* ---------------- reference renderer (verbatim from ../cs2 bundle) ---------------- */
const REF = (() => {
const Yn=(e,r,d)=>Math.max(r,Math.min(d,e));function Ke(e){return r=>{const d=Math.sin(r*12.9898+e*78.233)*43758.5453;return d-Math.floor(d)}}const Be=150,rn=1.3,Xn=12;function Nn(){const e=new Map;function r(m,n,z){const C=Math.floor(z*Xn),E=`${m}|${n.toFixed(4)}`;let t=e.get(E);if(!t||t.bucket!==C){!t&&e.size>96&&e.clear();const q=Math.ceil(Be*2*rn),A=(t==null?void 0:t.canvas)??document.createElement("canvas");A.width!==q&&(A.width=q,A.height=q);const G=A.getContext("2d");if(G){G.clearRect(0,0,q,q);const S=q/2;m==="smoke"?Gn(G,S,S,Be,z,n):_n(G,S,S,Be,z,n)}t={canvas:A,bucket:C},e.set(E,t)}return t.canvas}function d(m,n,z,C,E,t,q){const A=E*rn;m.drawImage(r(n,q,t),z-A,C-A,A*2,A*2)}return{paintSmoke:(m,n,z,C,E,t)=>d(m,"smoke",n,z,C,E,t),paintFire:(m,n,z,C,E,t)=>d(m,"fire",n,z,C,E,t),paintScorch:Zn,clear:()=>e.clear()}}function xn(e,r,d,m){e.save(),e.fillStyle="rgba(210, 215, 226, 0.4)",e.strokeStyle="rgba(228, 232, 240, 0.6)",e.lineWidth=1.5,e.beginPath(),e.arc(r,d,m,0,Math.PI*2),e.fill(),e.stroke(),e.restore()}function vn(e,r,d,m){e.save(),e.fillStyle="rgba(230, 90, 25, 0.32)",e.strokeStyle="rgba(255, 140, 40, 0.7)",e.lineWidth=1.5,e.beginPath(),e.arc(r,d,m,0,Math.PI*2),e.fill(),e.stroke(),e.restore()}function Gn(e,r,d,m,n,z){const C=Ke(z),E=34,t=[];for(let S=0;S<E;S++){const b=S/E*Math.PI*2,w=.86+.12*C(S+7)+.03*Math.sin(n*1.8+S*.5+z);t.push({x:r+Math.cos(b)*m*w,y:d+Math.sin(b)*m*w})}const q=()=>{e.beginPath(),e.moveTo(t[0].x,t[0].y);for(let S=1;S<t.length;S++)e.lineTo(t[S].x,t[S].y);e.closePath()};e.save(),e.filter=`blur(${Yn(m*.06,2,7)}px)`;const A=e.createRadialGradient(r,d,m*.1,r,d,m);A.addColorStop(0,"rgba(220, 224, 232, 0.46)"),A.addColorStop(.7,"rgba(208, 213, 224, 0.34)"),A.addColorStop(1,"rgba(206, 211, 222, 0.04)"),e.fillStyle=A,q(),e.fill();const G=7;for(let S=0;S<G;S++){const b=C(S+50)*Math.PI*2+n*.12,w=m*(.1+.42*C(S+80)),i=r+Math.cos(b)*w,W=d+Math.sin(b)*w,U=m*(.28+.22*C(S+90)),F=e.createRadialGradient(i,W,0,i,W,U);F.addColorStop(0,"rgba(230, 234, 242, 0.2)"),F.addColorStop(1,"rgba(220, 224, 232, 0)"),e.fillStyle=F,e.beginPath(),e.arc(i,W,U,0,Math.PI*2),e.fill()}e.filter="blur(1.5px)",e.strokeStyle="rgba(228, 232, 240, 0.4)",e.lineWidth=1.5,q(),e.stroke(),e.restore()}function _n(e,r,d,m,n,z){const C=Ke(z);e.save();const E=e.createRadialGradient(r,d,m*.1,r,d,m);E.addColorStop(0,"rgba(255, 120, 30, 0.28)"),E.addColorStop(.7,"rgba(220, 70, 20, 0.16)"),E.addColorStop(1,"rgba(180, 40, 10, 0)"),e.fillStyle=E,e.beginPath(),e.arc(r,d,m,0,Math.PI*2),e.fill(),e.globalCompositeOperation="lighter";const t=12;for(let q=0;q<t;q++){const A=C(q+1)*Math.PI*2,G=m*(.12+.62*C(q+31)),S=r+Math.cos(A)*G,b=d+Math.sin(A)*G,w=.55+.45*Math.sin(n*9+q*1.7+z),i=m*(.16+.13*w),W=e.createRadialGradient(S,b,0,S,b,i);W.addColorStop(0,`rgba(255, 235, 130, ${.5*w})`),W.addColorStop(.45,`rgba(255, 140, 40, ${.38*w})`),W.addColorStop(1,"rgba(200, 50, 10, 0)"),e.fillStyle=W,e.beginPath(),e.arc(S,b,i,0,Math.PI*2),e.fill()}e.restore()}function Zn(e,r,d,m,n){const z=Ke(n);e.save(),e.globalAlpha=.5;const C=30;e.beginPath();for(let t=0;t<C;t++){const q=t/C*Math.PI*2,A=.82+.14*z(t+101),G=r+Math.cos(q)*m*A,S=d+Math.sin(q)*m*A;t===0?e.moveTo(G,S):e.lineTo(G,S)}e.closePath();const E=e.createRadialGradient(r,d,m*.1,r,d,m);E.addColorStop(0,"rgba(16, 11, 8, 0.9)"),E.addColorStop(1,"rgba(28, 18, 12, 0.4)"),e.fillStyle=E,e.fill(),e.restore()}
  return { Nn, xn, vn, Zn };
})();

/* ---------------- current cs2demo renderer (verbatim from src/main.ts) ---------------- */
function makeMine(ctx) {
  const perfMode = false, SMOKE_LIFETIME_SEC = 17;
  const easeOutCubic = (k) => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
  const clampNum = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
"use strict";
function seededRand(seed) {
    return (n) => {
        const d = Math.sin(n * 12.9898 + seed * 78.233) * 43758.5453;
        return d - Math.floor(d);
    };
}
/** Offscreen sprites, cached per (kind, seed, 1/12s bucket) so blur + gradients are not redone every frame. */
const FX_SPRITE_R = 150;
const FX_SPRITE_PAD = 1.3;
const FX_SPRITES_PER_SEC = 12;
const fxSpriteCache = new Map();
function fxSprite(kind, seed, tSec) {
    const bucket = Math.floor(tSec * FX_SPRITES_PER_SEC);
    const key = `${kind}|${seed.toFixed(4)}|${bucket}`;
    let cv = fxSpriteCache.get(key);
    if (cv)
        return cv;
    if (fxSpriteCache.size > 96)
        fxSpriteCache.clear();
    const size = Math.ceil(FX_SPRITE_R * 2 * FX_SPRITE_PAD);
    cv = document.createElement("canvas");
    cv.width = size;
    cv.height = size;
    const g = cv.getContext("2d");
    if (g) {
        const c = size / 2;
        const t = bucket / FX_SPRITES_PER_SEC;
        if (kind === "smoke")
            paintSmokeSprite(g, c, c, FX_SPRITE_R, t, seed);
        else
            paintFireSprite(g, c, c, FX_SPRITE_R, t, seed);
    }
    fxSpriteCache.set(key, cv);
    return cv;
}
/** Wobbling blob outline (34 pts), soft inner puffs, blurred. */
function paintSmokeSprite(g, cx, cy, R, t, seed) {
    const rnd = seededRand(seed);
    const N = 34;
    const pts = [];
    for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const w = 0.86 + 0.12 * rnd(i + 7) + 0.03 * Math.sin(t * 1.8 + i * 0.5 + seed);
        pts.push({ x: cx + Math.cos(a) * R * w, y: cy + Math.sin(a) * R * w });
    }
    const outline = () => {
        g.beginPath();
        g.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++)
            g.lineTo(pts[i].x, pts[i].y);
        g.closePath();
    };
    g.save();
    g.filter = `blur(${clampNum(R * 0.06, 2, 7)}px)`;
    const grad = g.createRadialGradient(cx, cy, R * 0.1, cx, cy, R);
    grad.addColorStop(0, "rgba(220,224,232,0.46)");
    grad.addColorStop(0.7, "rgba(208,213,224,0.34)");
    grad.addColorStop(1, "rgba(206,211,222,0.04)");
    g.fillStyle = grad;
    outline();
    g.fill();
    for (let i = 0; i < 7; i++) {
        const a = rnd(i + 50) * Math.PI * 2 + t * 0.12;
        const d = R * (0.1 + 0.42 * rnd(i + 80));
        const px = cx + Math.cos(a) * d;
        const py = cy + Math.sin(a) * d;
        const pr = R * (0.28 + 0.22 * rnd(i + 90));
        const pg = g.createRadialGradient(px, py, 0, px, py, pr);
        pg.addColorStop(0, "rgba(230,234,242,0.2)");
        pg.addColorStop(1, "rgba(220,224,232,0)");
        g.fillStyle = pg;
        g.beginPath();
        g.arc(px, py, pr, 0, Math.PI * 2);
        g.fill();
    }
    g.filter = "blur(1.5px)";
    g.strokeStyle = "rgba(228,232,240,0.4)";
    g.lineWidth = 1.5;
    outline();
    g.stroke();
    g.restore();
}
/**
 * Fire pool: soft glow plus stacked, flickering flame-tongue polygons (dark red outer to pale
 * yellow core), blurred together — no discrete blobs.
 */
function paintFireSprite(g, cx, cy, R, t, seed) {
    const rnd = seededRand(seed);
    g.save();
    const base = g.createRadialGradient(cx, cy, R * 0.1, cx, cy, R);
    base.addColorStop(0, "rgba(255,120,30,0.30)");
    base.addColorStop(0.7, "rgba(220,70,20,0.18)");
    base.addColorStop(1, "rgba(180,40,10,0)");
    g.fillStyle = base;
    g.beginPath();
    g.arc(cx, cy, R, 0, Math.PI * 2);
    g.fill();
    const layers = [
        { scale: 1.0, color: "rgba(190,45,10,0.36)", lighter: false },
        { scale: 0.8, color: "rgba(255,105,25,0.34)", lighter: true },
        { scale: 0.58, color: "rgba(255,165,45,0.34)", lighter: true },
        { scale: 0.32, color: "rgba(255,225,130,0.36)", lighter: true },
    ];
    g.filter = `blur(${clampNum(R * 0.045, 3, 7)}px)`;
    const N = 44;
    layers.forEach((layer, li) => {
        g.globalCompositeOperation = layer.lighter ? "lighter" : "source-over";
        g.fillStyle = layer.color;
        g.beginPath();
        for (let i = 0; i <= N; i++) {
            const k = i % N;
            const a = (k / N) * Math.PI * 2;
            // alternating tongue / valley radius, seeded per layer, flickering over time
            const tongue = 0.9 + 0.1 * Math.sin(k * 2.1 + seed);
            const r = R *
                layer.scale *
                tongue *
                (0.84 + 0.14 * rnd(k + li * 19 + 3) + 0.07 * Math.sin(t * 7 + k * 0.9 + li * 2 + seed));
            const x = cx + Math.cos(a) * r;
            const y = cy + Math.sin(a) * r;
            if (i === 0)
                g.moveTo(x, y);
            else
                g.lineTo(x, y);
        }
        g.closePath();
        g.fill();
    });
    g.restore();
}
/**
 * Timer for smoke / molotov: a thin arc just outside the cloud that depletes clockwise (so the
 * cloud's own edge stays visible), with the seconds left centred inside.
 */
function drawCountdownRing(cx, cy, effectRadPx, remainingSec, totalSec, color) {
    const frac = clampNum(remainingSec / totalSec, 0, 1);
    const rr = effectRadPx * 1.1 + 2;
    ctx.save();
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();
    const label = String(Math.max(0, Math.ceil(remainingSec - 1e-9)));
    ctx.font = "700 11px Inter, Segoe UI, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(8,10,16,0.85)";
    ctx.strokeText(label, cx, cy + 0.5);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, cx, cy + 0.5);
    ctx.restore();
}

  return { fxSprite, drawCountdownRing, FX_SPRITE_PAD, easeOutCubic };
}

/* ---------------- harness ---------------- */
const SMOKE_R = 144, FIRE_R = 150, SMOKE_LIFE = 17, MOLLY_LIFE = 7.5;
const SIZE = 420;
const img = new Image(); let triedAlt = false; img.onerror = () => { if (!triedAlt) { triedAlt = true; img.src = "/maps/de_mirage_radar.png"; } }; img.src = "../public/maps/de_mirage_radar.png";
const refFx = REF.Nn();

function bg(ctx, ppu) {
  ctx.fillStyle = "#07090c"; ctx.fillRect(0, 0, SIZE, SIZE);
  if (!img.complete) return;
  const pxPerRadar = 5.02 * ppu;          // canvas px per radar px
  const s = 1024 * pxPerRadar;
  const cx = 540, cy = 470;               // radar px focused (mid / top-mid)
  ctx.drawImage(img, SIZE / 2 - cx * pxPerRadar, SIZE / 2 - cy * pxPerRadar, s, s);
  ctx.fillStyle = "rgba(7,9,12,.25)"; ctx.fillRect(0, 0, SIZE, SIZE);
}

/* the reference's timer: 11px ring + coloured number */
function refRing(ctx, x, y, rem, total, kind) {
  const f = Math.max(0, Math.min(1, rem / total)), col = kind === "smoke" ? "rgba(232,236,244,.95)" : "rgba(255,150,60,.98)";
  ctx.save(); ctx.lineCap = "round"; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 11, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.stroke();
  ctx.fillStyle = col; ctx.font = "700 11px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 3; ctx.fillText(String(Math.max(0, Math.ceil(rem))), x, y + .5); ctx.restore();
}

/* proposal timer: thin arc hugging the rim + number pill under the effect (map stays readable) */
function pill(ctx, x, y, text, col, frac, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = "700 11px Inter, sans-serif"; const w = Math.max(38, ctx.measureText(text).width + 14), h = 17;
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 8.5); ctx.fillStyle = "rgba(10,12,18,.85)"; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = col.replace(/[\d.]+\)$/, ".32)"); ctx.fillRect(x - w / 2, y - h / 2, w * Math.max(0, frac), h); ctx.restore();
  ctx.lineWidth = 1.25; ctx.strokeStyle = col; ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 8.5); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, x, y + .5); ctx.restore();
}
function rimArc(ctx, x, y, r, frac, col, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.max(0, frac) * Math.PI * 2); ctx.stroke(); ctx.restore();
}

function draw(variant, kind, ctx, ppu, t) {
  bg(ctx, ppu);
  const x = SIZE / 2, y = SIZE / 2;
  const life = kind === "smoke" ? SMOKE_LIFE : MOLLY_LIFE;
  const age = t * life, rem = life - age;
  const R = (kind === "smoke" ? SMOKE_R : FIRE_R) * ppu;
  const seed = kind === "smoke" ? x * .011 + y * .015 : x * .013 + y * .017;
  if (variant === "ref") {
    if (kind === "smoke") refFx.paintSmoke(ctx, x, y, R, age, seed);
    else { REF.Zn(ctx, x, y, R, seed); refFx.paintFire(ctx, x, y, R, age, seed); }
    refRing(ctx, x, y, rem, life, kind);
    return;
  }
  const M = ctx.__m || (ctx.__m = makeMine(ctx));
  if (variant === "cur") {
    const A = R * M.FX_SPRITE_PAD;
    ctx.drawImage(M.fxSprite(kind === "smoke" ? "smoke" : "fire", seed, age), x - A, y - A, A * 2, A * 2);
    M.drawCountdownRing(x, y, rem, life, kind === "smoke" ? "rgba(232,236,244,.95)" : "rgba(255,150,60,.98)");
    return;
  }
  /* proposal: reference sprites (organic edge) + a gentle alpha boost, thin rim arc, number pill below */
  const grow = M.easeOutCubic(age / (kind === "smoke" ? .6 : .5));
  const r = R * (kind === "smoke" ? .4 + .6 * grow : .5 + .5 * grow);
  const fade = kind === "smoke" ? Math.min(1, rem / 3) : Math.min(1, rem / .8);
  ctx.save(); ctx.globalAlpha = fade;
  if (kind === "smoke") { refFx.paintSmoke(ctx, x, y, r, age, seed); ctx.globalAlpha = fade * .7; refFx.paintSmoke(ctx, x, y, r, age, seed); }
  else { refFx.paintFire(ctx, x, y, r, age, seed); ctx.globalAlpha = fade * .8; refFx.paintFire(ctx, x, y, r, age, seed); }
  ctx.restore();
  const col = kind === "smoke" ? "rgba(236,240,248,.95)" : "rgba(255,160,70,.98)";
  pill(ctx, x, y + Math.max(8, r) + 12, String(Math.max(0, Math.ceil(rem))) + "s", col, rem / life, Math.max(.35, fade));
}

/* ---------------- build UI ---------------- */
const cols = [
  ["ref", "Reference", "../cs2", "Additive flame blobs, blobby smoke. No fade, 11px ring over the middle."],
  ["cur", "Current", "cs2demo today", "cs2demo after porting the reference code (should match the left column)."],
  ["prop", "Proposal", "new", "Reference sprites (organic edge kept) with a gentle alpha boost. Timer is a depleting pill below, so nothing sits on top of the cloud."],
];
const grid = document.getElementById("grid");
const panes = [];
for (const kind of ["smoke", "molly"]) {
  const h = document.createElement("div"); h.className = "row-h"; h.textContent = kind === "smoke" ? "Smoke" : "Molotov / incendiary"; grid.appendChild(h);
  for (const [v, name, tag, note] of cols) {
    const cell = document.createElement("div"); cell.className = "cell";
    cell.innerHTML = `<div class="col-h">${name} · <em>${tag}</em></div><canvas width="${SIZE}" height="${SIZE}"></canvas><div class="note">${note}</div>`;
    grid.appendChild(cell);
    panes.push({ v, kind, ctx: cell.querySelector("canvas").getContext("2d") });
  }
}
const zoom = document.getElementById("zoom"), time = document.getElementById("time"), anim = document.getElementById("anim");
const qs = new URLSearchParams(location.search); if (qs.get("zoom")) zoom.value = qs.get("zoom"); if (qs.get("time")) time.value = qs.get("time");
function ppuNow() { return 0.176 * Number(zoom.value); }
function render() {
  const ppu = ppuNow(), t = Number(time.value);
  document.getElementById("zoomv").textContent = Number(zoom.value).toFixed(1) + "×";
  document.getElementById("timev").textContent = "smoke " + (t * SMOKE_LIFE).toFixed(1) + "s · molly " + (t * MOLLY_LIFE).toFixed(1) + "s";
  for (const p of panes) { p.ctx.save(); draw(p.v, p.kind, p.ctx, ppu, t); p.ctx.restore(); }
}
zoom.oninput = time.oninput = render;
img.onload = render;
let last = 0;
function loop(ts) { if (anim.checked) { const dt = (ts - last) / 1000; time.value = String((Number(time.value) + dt / 14) % 1); render(); } last = ts; requestAnimationFrame(loop); }
requestAnimationFrame(loop);
render();
</script>
</body>
